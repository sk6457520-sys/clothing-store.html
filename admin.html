<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clothing Store India - Admin</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#111;
  color:white;
  padding:18px;
  text-align:center;
}

.container{
  max-width:600px;
  margin:20px auto;
  padding:15px;
}

.card{
  background:white;
  padding:20px;
  border-radius:14px;
  margin-bottom:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.10);
}

h2{
  margin-top:0;
}

input,select{
  width:100%;
  padding:13px;
  margin:8px 0 14px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:8px;
  background:#111;
  color:white;
  font-size:16px;
  cursor:pointer;
  margin-top:5px;
}

button.delete{
  background:#d32f2f;
}

button.logout{
  background:#555;
}

.product{
  border:1px solid #ddd;
  border-radius:12px;
  padding:12px;
  margin-top:15px;
}

.product img{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:10px;
}

.price{
  font-size:20px;
  font-weight:bold;
  margin:8px 0;
}

.hidden{
  display:none;
}

.message{
  padding:10px;
  border-radius:8px;
  margin-bottom:12px;
  background:#eee;
}
</style>
</head>

<body>

<header>
  <h1>Clothing Store India</h1>
  <p>Admin Panel</p>
</header>

<div class="container">

<!-- LOGIN -->
<div id="loginBox" class="card">
  <h2>Admin Login</h2>

  <input
    type="email"
    id="email"
    placeholder="Admin Email"
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
  >

  <button onclick="login()">LOGIN</button>

  <div id="loginMessage" class="message"></div>
</div>


<!-- ADMIN PANEL -->
<div id="adminPanel" class="hidden">

  <div class="card">

    <h2>Add New Product</h2>

    <input
      type="text"
      id="productName"
      placeholder="Product Name"
    >

    <input
      type="number"
      id="productPrice"
      placeholder="Price ₹"
    >

    <select id="productCategory">
      <option value="Men">Men</option>
      <option value="Women">Women</option>
    </select>

    <input
      type="text"
      id="productImage"
      placeholder="Product Image URL"
    >

    <button onclick="addProduct()">
      ADD PRODUCT
    </button>

    <div id="addMessage" class="message"></div>

  </div>


  <div class="card">

    <h2>Products</h2>

    <div id="productsList">
      Loading...
    </div>

  </div>


  <div class="card">
    <button class="logout" onclick="logout()">
      LOGOUT
    </button>
  </div>

</div>

</div>


<script type="module">

/* =========================================
   FIREBASE IMPORT
========================================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  doc
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

  apiKey: "PASTE_YOUR_API_KEY",

  authDomain:
    "clothing-store-india.firebaseapp.com",

  projectId:
    "clothing-store-india",

  storageBucket:
    "PASTE_YOUR_STORAGE_BUCKET",

  messagingSenderId:
    "PASTE_YOUR_MESSAGING_SENDER_ID",

  appId:
    "PASTE_YOUR_APP_ID"

};


/* =========================================
   FIREBASE START
========================================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =========================================
   LOGIN
========================================= */

window.login = async function(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  if(!email || !password){

    message.innerText =
      "Email aur password dono bharen.";

    return;
  }

  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    message.innerText =
      "Login successful.";

  }catch(error){

    message.innerText =
      "Login failed: " + error.message;

  }

};


/* =========================================
   AUTH CHECK
========================================= */

onAuthStateChanged(auth, user => {

  const loginBox =
    document.getElementById("loginBox");

  const adminPanel =
    document.getElementById("adminPanel");

  if(user){

    loginBox.classList.add("hidden");

    adminPanel.classList.remove("hidden");

    loadProducts();

  }else{

    loginBox.classList.remove("hidden");

    adminPanel.classList.add("hidden");

  }

});


/* =========================================
   ADD PRODUCT
========================================= */

window.addProduct = async function(){

  const name =
    document.getElementById("productName").value.trim();

  const price =
    document.getElementById("productPrice").value;

  const category =
    document.getElementById("productCategory").value;

  const image =
    document.getElementById("productImage").value.trim();

  const message =
    document.getElementById("addMessage");


  if(!name || !price || !image){

    message.innerText =
      "Product name, price aur image URL bharen.";

    return;
  }


  try{

    await addDoc(
      collection(db,"products"),
      {
        name:name,
        price:Number(price),
        category:category,
        image:image,
        createdAt:Date.now()
      }
    );


    message.innerText =
      "Product successfully add ho gaya.";

    document.getElementById("productName").value="";
    document.getElementById("productPrice").value="";
    document.getElementById("productImage").value="";

    loadProducts();

  }catch(error){

    message.innerText =
      "Error: " + error.message;

  }

};


/* =========================================
   LOAD PRODUCTS
========================================= */

async function loadProducts(){

  const list =
    document.getElementById("productsList");

  list.innerHTML="Loading...";

  try{

    const snapshot =
      await getDocs(
        collection(db,"products")
      );

    list.innerHTML="";

    if(snapshot.empty){

      list.innerHTML =
        "<p>Abhi koi product nahi hai.</p>";

      return;
    }


    snapshot.forEach(item => {

      const data = item.data();

      const div =
        document.createElement("div");

      div.className="product";

      div.innerHTML=`

        <img
          src="${data.image}"
          alt="${data.name}"
        >

        <h3>${data.name}</h3>

        <div class="price">
          ₹${data.price}
        </div>

        <p>
          Category: ${data.category}
        </p>

        <button
          class="delete"
          onclick="deleteProduct('${item.id}')"
        >
          DELETE PRODUCT
        </button>

      `;

      list.appendChild(div);

    });

  }catch(error){

    list.innerHTML =
      "Products load nahi ho rahe: "
      + error.message;

  }

}


/* =========================================
   DELETE PRODUCT
========================================= */

window.deleteProduct = async function(id){

  const confirmDelete =
    confirm(
      "Kya aap is product ko delete karna chahte hain?"
    );

  if(!confirmDelete){
    return;
  }


  try{

    await deleteDoc(
      doc(db,"products",id)
    );

    alert("Product delete ho gaya.");

    loadProducts();

  }catch(error){

    alert(
      "Delete failed: "
      + error.message
    );

  }

};


/* =========================================
   LOGOUT
========================================= */

window.logout = async function(){

  await signOut(auth);

};

</script>

</body>
  </html>
