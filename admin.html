<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clothing Store India - Admin Panel</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f3f7;
  color:#222;
}

header{
  background:#111;
  color:white;
  padding:18px 15px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:24px;
}

header p{
  margin:6px 0 0;
  color:#ddd;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  border-radius:12px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

h2{
  margin-top:0;
  font-size:21px;
}

input,select,textarea{
  width:100%;
  padding:13px;
  margin:7px 0 12px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  border:0;
  border-radius:8px;
  padding:12px 16px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  margin:4px;
}

.primary{
  background:#111;
  color:white;
}

.green{
  background:#16803c;
  color:white;
}

.blue{
  background:#1266d6;
  color:white;
}

.red{
  background:#d71920;
  color:white;
}

.gray{
  background:#777;
  color:white;
}

.login-box{
  max-width:420px;
  margin:60px auto;
}

.product{
  border:1px solid #ddd;
  border-radius:10px;
  padding:12px;
  margin-bottom:12px;
}

.product img{
  width:100%;
  max-width:180px;
  height:180px;
  object-fit:contain;
  display:block;
  margin:auto;
  border-radius:8px;
  background:#f5f5f5;
}

.product h3{
  margin-bottom:5px;
}

.price{
  font-size:19px;
  font-weight:bold;
}

.category{
  color:#666;
  font-size:14px;
}

.logo-preview{
  width:130px;
  height:130px;
  object-fit:contain;
  border:1px solid #ddd;
  border-radius:10px;
  display:block;
  margin:10px 0;
  background:#f7f7f7;
}

.order{
  border:1px solid #ddd;
  border-radius:10px;
  padding:14px;
  margin-bottom:12px;
}

.order-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:8px;
}

.order-info{
  line-height:1.6;
  font-size:14px;
  word-break:break-word;
}

.status{
  font-weight:bold;
  padding:8px;
  border-radius:7px;
  margin:8px 0;
}

.hidden{
  display:none;
}

.message{
  padding:10px;
  border-radius:8px;
  margin:10px 0;
  background:#eee;
}

.small{
  font-size:13px;
  color:#666;
}

hr{
  border:0;
  border-top:1px solid #ddd;
  margin:20px 0;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">

  <div class="login-box card">

    <h2>🔐 Admin Login</h2>

    <input
      type="email"
      id="loginEmail"
      placeholder="Admin Email"
    >

    <input
      type="password"
      id="loginPassword"
      placeholder="Password"
    >

    <button
      class="primary"
      style="width:100%;"
      onclick="loginAdmin()"
    >
      LOGIN
    </button>

    <div id="loginMessage"></div>

  </div>

</div>


<!-- ADMIN PANEL -->
<div id="adminPage" class="hidden">

<header>

  <h1>Clothing Store India</h1>

  <p>Admin Panel</p>

</header>


<div class="container">


<!-- STORE SETTINGS -->
<div class="card">

  <h2>🏪 Store Settings</h2>

  <label>Shop Name</label>

  <input
    type="text"
    id="storeName"
    placeholder="Shop Name"
  >

  <label>UPI ID</label>

  <input
    type="text"
    id="upiId"
    placeholder="UPI ID"
  >

  <label>Logo Image URL</label>

  <input
    type="url"
    id="logoUrl"
    placeholder="Logo Image URL"
    oninput="previewLogo()"
  >

  <img
    id="logoPreview"
    class="logo-preview"
    src=""
    alt="Logo Preview"
  >

  <button
    class="green"
    onclick="saveSettings()"
  >
    SAVE STORE SETTINGS
  </button>

  <div id="settingsMessage"></div>

</div>


<!-- ADD / EDIT PRODUCT -->
<div class="card">

  <h2 id="productFormTitle">➕ Add New Product</h2>

  <input
    type="hidden"
    id="productId"
  >

  <label>Product Name</label>

  <input
    type="text"
    id="productName"
    placeholder="Example: Men's Shirt"
  >

  <label>Price</label>

  <input
    type="number"
    id="productPrice"
    placeholder="Example: 999"
  >

  <label>Category</label>

  <select id="productCategory">

    <option value="Men">Men</option>

    <option value="Women">Women</option>

  </select>

  <label>Product Image URL</label>

  <input
    type="url"
    id="productImage"
    placeholder="Paste product image URL"
  >

  <button
    class="primary"
    onclick="saveProduct()"
    id="productSaveButton"
  >
    ADD PRODUCT
  </button>

  <button
    class="gray hidden"
    onclick="cancelEdit()"
    id="cancelEditButton"
  >
    CANCEL EDIT
  </button>

  <div id="productMessage"></div>

</div>


<!-- PRODUCTS -->
<div class="card">

  <h2>👕 Your Products</h2>

  <div id="productsList">
    Loading products...
  </div>

</div>


<!-- ORDERS -->
<div class="card">

  <h2>📦 Customer Orders</h2>

  <button
    class="blue"
    onclick="loadOrders()"
  >
    🔄 REFRESH ORDERS
  </button>

  <div id="ordersList">
    Loading orders...
  </div>

</div>


<!-- LOGOUT -->
<div class="card">

  <button
    class="red"
    style="width:100%;"
    onclick="logoutAdmin()"
  >
    🚪 LOGOUT
  </button>

</div>


</div>
</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  getDoc,
  doc,
  setDoc,
  updateDoc,
  deleteDoc
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey: "AIzaSyDjG5fKH7apknSPMUCBs3pVa91Hj5vMnB4",

  authDomain: "clothing-store-india.firebaseapp.com",

  projectId: "clothing-store-india",

  storageBucket: "clothing-store-india.firebasestorage.app",

  messagingSenderId: "1032694314798",

  appId: "1:1032694314798:web:00484f9e6fc47394ddacbf"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


const ADMIN_EMAIL = "sk6457520@gmail.com";


/* =========================
   LOGIN
========================= */

window.loginAdmin = async function(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const message =
    document.getElementById("loginMessage");


  if(!email || !password){

    message.innerHTML =
      '<div class="message">Email aur password bharen.</div>';

    return;
  }


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(error){

    message.innerHTML =
      '<div class="message">Login failed. Email ya password check karein.</div>';

  }

};


/* =========================
   AUTH CHECK
========================= */

onAuthStateChanged(auth, async(user)=>{

  if(user && user.email === ADMIN_EMAIL){

    document
      .getElementById("loginPage")
      .classList.add("hidden");

    document
      .getElementById("adminPage")
      .classList.remove("hidden");


    await loadSettings();

    await loadProducts();

    await loadOrders();

  }

  else{

    document
      .getElementById("loginPage")
      .classList.remove("hidden");

    document
      .getElementById("adminPage")
      .classList.add("hidden");

  }

});


/* =========================
   LOGOUT
========================= */

window.logoutAdmin = async function(){

  await signOut(auth);

};


/* =========================
   STORE SETTINGS
========================= */

async function loadSettings(){

  try{

    const ref =
      doc(db,"settings","store");

    const snap =
      await getDoc(ref);


    if(snap.exists()){

      const data = snap.data();


      document.getElementById("storeName").value =
        data.storeName || "";


      document.getElementById("upiId").value =
        data.upiId || "";


      document.getElementById("logoUrl").value =
        data.logoUrl || "";


      document.getElementById("logoPreview").src =
        data.logoUrl || "";

    }

  }catch(error){

    console.log(error);

  }

}


window.previewLogo = function(){

  const url =
    document.getElementById("logoUrl").value.trim();

  document.getElementById("logoPreview").src =
    url;

};


window.saveSettings = async function(){

  const storeName =
    document.getElementById("storeName").value.trim();

  const upiId =
    document.getElementById("upiId").value.trim();

  const logoUrl =
    document.getElementById("logoUrl").value.trim();


  if(!storeName){

    alert("Shop Name bharen.");

    return;

  }


  try{

    await setDoc(

      doc(db,"settings","store"),

      {

        storeName:storeName,

        upiId:upiId,

        logoUrl:logoUrl,

        updatedAt:Date.now()

      },

      {merge:true}

    );


    document.getElementById("settingsMessage").innerHTML =
      '<div class="message">✅ Store settings save ho gayi.</div>';


  }catch(error){

    console.error(error);

    document.getElementById("settingsMessage").innerHTML =
      '<div class="message">❌ Settings save nahi hui.</div>';

  }

};


/* =========================
   SAVE PRODUCT
========================= */

window.saveProduct = async function(){

  const productId =
    document.getElementById("productId").value.trim();

  const name =
    document.getElementById("productName").value.trim();

  const price =
    document.getElementById("productPrice").value.trim();

  const category =
    document.getElementById("productCategory").value;

  const image =
    document.getElementById("productImage").value.trim();


  if(!name){

    alert("Product Name bharen.");

    return;

  }


  if(!price){

    alert("Product Price bharen.");

    return;

  }


  if(!image){

    alert("Product Image URL bharen.");

    return;

  }


  try{

    if(productId){

      await updateDoc(

        doc(db,"products",productId),

        {

          name:name,

          price:Number(price),

          category:category,

          image:image,

          updatedAt:Date.now()

        }

      );


      document.getElementById("productMessage").innerHTML =
        '<div class="message">✅ Product update ho gaya.</div>';

    }

    else{

      await addDoc(

        collection(db,"products"),

        {

          name:name,

          price:Number(price),

          category:category,

          image:image,

          createdAt:Date.now(),

          updatedAt:Date.now()

        }

      );


      document.getElementById("productMessage").innerHTML =
        '<div class="message">✅ Product add ho gaya.</div>';

    }


    clearProductForm();

    await loadProducts();


  }catch(error){

    console.error(error);

    document.getElementById("productMessage").innerHTML =
      '<div class="message">❌ Product save nahi hua.</div>';

  }

};


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

  const list =
    document.getElementById("productsList");

  list.innerHTML =
    "Loading products...";


  try{

    const snapshot =
      await getDocs(collection(db,"products"));


    if(snapshot.empty){

      list.innerHTML =
        '<div class="message">Abhi koi product nahi hai.</div>';

      return;

    }


    list.innerHTML = "";


    const products = [];


    snapshot.forEach((item)=>{

      products.push({

        id:item.id,

        ...item.data()

      });

    });


    products.sort((a,b)=>
      (b.createdAt || 0) -
      (a.createdAt || 0)
    );


    products.forEach(product=>{

      const div =
        document.createElement("div");

      div.className = "product";


      const img =
        document.createElement("img");

      img.src =
        product.image || "";

      img.onerror = function(){

        this.style.display = "none";

      };


      const title =
        document.createElement("h3");

      title.textContent =
        product.name || "No Name";


      const price =
        document.createElement("div");

      price.className = "price";

      price.textContent =
        "₹" + (product.price || 0);


      const category =
        document.createElement("div");

      category.className = "category";

      category.textContent =
        "Category: " +
        (product.category || "");


      const editButton =
        document.createElement("button");

      editButton.className = "blue";

      editButton.textContent = "✏️ EDIT";

      editButton.onclick = function(){

        editProduct(product);

      };


      const deleteButton =
        document.createElement("button");

      deleteButton.className = "red";

      deleteButton.textContent = "🗑️ DELETE";

      deleteButton.onclick = function(){

        deleteProduct(product.id);

      };


      div.appendChild(img);

      div.appendChild(title);

      div.appendChild(price);

      div.appendChild(category);

      div.appendChild(editButton);

      div.appendChild(deleteButton);

      list.appendChild(div);

    });


  }catch(error){

    console.error(error);

    list.innerHTML =
      '<div class="message">Products load nahi ho rahe.</div>';

  }

}


/* =========================
   EDIT PRODUCT
========================= */

function editProduct(product){

  document.getElementById("productId").value =
    product.id;

  document.getElementById("productName").value =
    product.name || "";

  document.getElementById("productPrice").value =
    product.price || "";

  document.getElementById("productCategory").value =
    product.category || "Men";

  document.getElementById("productImage").value =
    product.image || "";


  document.getElementById("productFormTitle").textContent =
    "✏️ Edit Product";


  document.getElementById("productSaveButton").textContent =
    "UPDATE PRODUCT";


  document
    .getElementById("cancelEditButton")
    .classList.remove("hidden");


  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

}


window.cancelEdit = function(){

  clearProductForm();

};


function clearProductForm(){

  document.getElementById("productId").value = "";

  document.getElementById("productName").value = "";

  document.getElementById("productPrice").value = "";

  document.getElementById("productCategory").value = "Men";

  document.getElementById("productImage").value = "";


  document.getElementById("productFormTitle").textContent =
    "➕ Add New Product";


  document.getElementById("productSaveButton").textContent =
    "ADD PRODUCT";


  document
    .getElementById("cancelEditButton")
    .classList.add("hidden");

}


/* =========================
   DELETE PRODUCT
========================= */

window.deleteProduct = async function(id){

  const yes =
    confirm(
      "Kya aap is product ko delete karna chahte hain?"
    );


  if(!yes){

    return;

  }


  try{

    await deleteDoc(
      doc(db,"products",id)
    );


    await loadProducts();


  }catch(error){

    console.error(error);

    alert("Product delete nahi hua.");

  }

};


/* =========================
   ORDERS
========================= */

window.loadOrders = async function(){

  const list =
    document.getElementById("ordersList");

  list.innerHTML =
    "Loading orders...";


  try{

    const snapshot =
      await getDocs(collection(db,"orders"));


    if(snapshot.empty){

      list.innerHTML =
        '<div class="message">Abhi koi customer order nahi hai.</div>';

      return;

    }


    const orders = [];


    snapshot.forEach(item=>{

      orders.push({

        id:item.id,

        ...item.data()

      });

    });


    orders.sort((a,b)=>
      (b.createdAt || 0) -
      (a.createdAt || 0)
    );


    list.innerHTML = "";


    orders.forEach(order=>{

      const div =
        document.createElement("div");

      div.className = "order";


      const title =
        document.createElement("div");

      title.className = "order-title";

      title.textContent =
        "📦 Order ID: " +
        order.id;


      const info =
        document.createElement("div");

      info.className = "order-info";


      let html = "";


      if(order.name || order.customerName){

        html +=
          "<b>Name:</b> " +
          escapeHtml(
            order.name ||
            order.customerName
          ) +
          "<br>";

      }


      if(order.mobile || order.phone){

        html +=
          "<b>Mobile:</b> " +
          escapeHtml(
            order.mobile ||
            order.phone
          ) +
          "<br>";

      }


      if(order.address){

        html +=
          "<b>Address:</b> " +
          escapeHtml(
            order.address
          ) +
          "<br>";

      }


      if(order.pincode || order.pinCode){

        html +=
          "<b>PIN Code:</b> " +
          escapeHtml(
            order.pincode ||
            order.pinCode
          ) +
          "<br>";

      }


      if(order.total){

        html +=
          "<b>Total:</b> ₹" +
          escapeHtml(
            String(order.total)
          ) +
          "<br>";

      }


      if(order.items){

        let itemText = "";

        try{

          itemText =
            typeof order.items === "string"
            ? order.items
            : JSON.stringify(order.items);

        }catch(e){

          itemText =
            String(order.items);

        }


        html +=
          "<b>Items:</b> " +
          escapeHtml(itemText) +
          "<br>";

      }


      if(order.createdAt){

        html +=
          "<b>Order Time:</b> " +
          new Date(
            order.createdAt
          ).toLocaleString("en-IN") +
          "<br>";

      }


      info.innerHTML = html;


      const statusLabel =
        document.createElement("div");

      statusLabel.innerHTML =
        "<b>Order Status:</b>";


      const statusSelect =
        document.createElement("select");


      const statuses = [

        "Pending",

        "Confirmed",

        "Shipped",

        "Delivered",

        "Cancelled"

      ];


      statuses.forEach(status=>{

        const option =
          document.createElement("option");

        option.value =
          status;

        option.textContent =
          status;

        statusSelect.appendChild(option);

      });


      statusSelect.value =
        order.status || "Pending";


      statusSelect.onchange =
        function(){

          updateOrderStatus(
            order.id,
            this.value
          );

        };


      const deleteButton =
        document.createElement("button");

      deleteButton.className = "red";

      deleteButton.textContent =
        "🗑️ DELETE ORDER";

      deleteButton.onclick =
        function(){

          deleteOrder(order.id);

        };


      div.appendChild(title);

      div.appendChild(info);

      div.appendChild(statusLabel);

      div.appendChild(statusSelect);

      div.appendChild(
        document.createElement("br")
      );

      div.appendChild(deleteButton);

      list.appendChild(div);

    });


  }catch(error){

    console.error(error);

    list.innerHTML =
      '<div class="message">Orders load nahi ho rahe.</div>';

  }

};


/* =========================
   UPDATE ORDER STATUS
========================= */

async function updateOrderStatus(id,status){

  try{

    await updateDoc(

      doc(db,"orders",id),

      {

        status:status,

        updatedAt:Date.now()

      }

    );

  }catch(error){

    console.error(error);

    alert(
      "Order status update nahi hua."
    );

  }

}

========================= */
