<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administrator Login</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#643cff,#c72dbd);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:650px;
    background:white;
    border-radius:40px;
    padding:45px 35px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.20);
}

.logo{
    width:145px;
    height:145px;
    border-radius:50%;
    margin:0 auto 30px;
    background:linear-gradient(135deg,#643cff,#d42caa);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:65px;
}

h1{
    font-size:42px;
    color:#252525;
    margin-bottom:10px;
}

.subtitle{
    font-size:24px;
    color:#777;
    margin-bottom:40px;
}

label{
    display:block;
    text-align:left;
    font-size:23px;
    font-weight:bold;
    color:#333;
    margin:20px 0 10px;
}

input{
    width:100%;
    height:70px;
    border:2px solid #ddd;
    border-radius:18px;
    padding:0 22px;
    font-size:20px;
    outline:none;
}

input:focus{
    border-color:#743cff;
}

button{
    width:100%;
    height:70px;
    border:none;
    border-radius:18px;
    margin-top:25px;
    color:white;
    font-size:27px;
    font-weight:bold;
    cursor:pointer;
    background:linear-gradient(90deg,#633cff,#e238a8);
}

#message{
    display:none;
    margin-top:25px;
    padding:18px;
    border-radius:15px;
    background:#f1f1f1;
    font-size:18px;
}

.secure{
    margin-top:35px;
    color:#999;
    font-size:17px;
}

@media(max-width:600px){
    .login-box{
        padding:40px 20px;
        border-radius:30px;
    }

    h1{
        font-size:32px;
    }

    .subtitle{
        font-size:19px;
    }

    label{
        font-size:20px;
    }

    input{
        height:62px;
        font-size:18px;
    }

    button{
        height:62px;
        font-size:23px;
    }
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">🔐</div>

    <h1>Administrator Login</h1>

    <div class="subtitle">
        Secure access to your store
    </div>

    <label>Admin Email</label>

    <input
        type="email"
        id="email"
        placeholder="Enter admin email"
    >

    <label>Password</label>

    <input
        type="password"
        id="password"
        placeholder="Enter password"
    >

    <button onclick="login()">
        LOGIN
    </button>

    <div id="message"></div>

    <div class="secure">
        🔒 Secure Admin Access
    </div>

</div>

<script>

function login(){

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    const adminEmail =
        "sk6457520@gmail.com";

    const newPassword =
        "Sonugneeresh@98";

    if(email === "" || password === ""){

        message.style.display = "block";

        message.innerText =
            "❌ Email aur Password dono bharen.";

        return;
    }

    if(email === adminEmail && password === newPassword){

        message.style.display = "block";

        message.innerText =
            "✅ Login Successful!";

        setTimeout(function(){

            window.location.href = "admin.html";

        },1000);

    }else{

        message.style.display = "block";

        message.innerText =
            "❌ Email ya Password galat hai.";

    }

}

</script>

</body>
  </html>
