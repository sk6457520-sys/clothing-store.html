<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clothing Store India - Admin</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f1f3f6;color:#222}
header{background:#111;color:#fff;text-align:center;padding:18px}
.container{max-width:900px;margin:auto;padding:15px}
.card{background:#fff;padding:18px;margin:18px 0;border-radius:14px;box-shadow:0 2px 10px #ddd}
.login{max-width:500px;margin:70px auto}
input,select{width:100%;padding:13px;margin:7px 0 14px;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{border:0;padding:12px 16px;border-radius:8px;font-weight:bold;margin:4px;cursor:pointer}
.loginbtn{width:100%;background:#111;color:#fff;font-size:17px}
.green{background:#16803c;color:#fff}
.blue{background:#1266d6;color:#fff}
.red{background:#d71920;color:#fff}
.gray{background:#777;color:#fff}
.hidden{display:none}
.msg{padding:10px;margin-top:10px;background:#eee;border-radius:8px}
.product,.order{border:1px solid #ddd;padding:12px;margin:10px 0;border-radius:10px}
.product img{width:150px;height:150px;object-fit:contain;display:block;background:#f5f5f5}
.logo{width:130px;height:130px;object-fit:contain;border:1px solid #ddd;border-radius:10px}
.price{font-size:19px;font-weight:bold;margin:6px 0}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">
  <div class="card login">
    <h2>🔐 Admin Login</h2>

    <input id="email"
      type="email"
      placeholder="Admin Email"
      value="sk6457520@gmail.com">

    <input id="password"
      type="password"
      placeholder="Password">

    <button id="loginBtn" class="loginbtn">
      LOGIN
    </button>

    <div id="loginMsg"></div>
  </div>
</div>


<!-- ADMIN -->
<div id="adminPage" class="hidden">

<header>
  <h1>Clothing Store India</h1>
  <p>Admin Panel</p>
</header>

<div class="container">

<!-- SETTINGS -->
<div class="card">
<h2>🏪 Store Settings</h2>

<label>Shop Name</label>
<input id="storeName" type="text">

<label>UPI ID</label>
<input id="upiId" type="text">

<label>Logo Image URL</label>
<input id="logoUrl" type="url">

<img id="logoPreview" class="logo">

<br><br>

<button id="saveSettings" class="green">
SAVE STORE SETTINGS
</button>

<div id="settingsMsg"></div>
</div>


<!-- PRODUCT -->
<div class="card">

<h2 id="productHeading">➕ Add New Product</h2>

<input id="productId" type="hidden">

<label>Product Name</label>
<input id="productName" type="text" placeholder="Product Name">

<label>Price</label>
<input id="productPrice" type="number" placeholder="Price">

<label>Category</label>
<select id="productCategory">
<option value="Men">Men</option>
<option value="Women">Women</option>
</select>

<label>Product Image URL</label>
<input id="productImage" type="url" placeholder="Image URL">

<button id="saveProduct" class="green">
ADD PRODUCT
</button>

<button id="cancelEdit" class="gray hidden">
CANCEL
</button>

<div id="productMsg"></div>

</div>


<!-- PRODUCTS -->
<div class="card">

<h2>👕 Your Products</h2>

<div id="products">
Loading...
</div>

</div>


<!-- ORDERS -->
<div class="card">

<h2>📦 Customer Orders</h2>

<button id="refreshOrders" class="blue">
🔄 REFRESH ORDERS
</button>

<div id="orders">
Loading...
</div>

</div>


<!-- LOGOUT -->
<div class="card">

<button id="logout" class="red" style="width:100%">
🚪 LOGOUT
</button>

</div>

</div>
</div>


<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig = {
apiKey:"AIzaSyDjG5fKH7apknSPMUCB3s5pVa91Hj5vMnB4",
authDomain:"clothing-store-india.firebaseapp.com",
projectId:"clothing-store-india",
storageBucket:"clothing-store-india.firebasestorage.app",
messagingSenderId:"1032694314798",
appId:"1:1032694314798:web:00484f9e6fc47394ddacbf"
};

firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const db=firebase.firestore();

const ADMIN="sk6457520@gmail.com";


/* LOGIN */

document.getElementById("loginBtn").onclick=function(){

let email=document.getElementById("email").value.trim();
let password=document.getElementById("password").value;

let msg=document.getElementById("loginMsg");

if(!email){
msg.innerHTML='<div class="msg">Email bharen.</div>';
return;
}

if(!password){
msg.innerHTML='<div class="msg">Password bharen.</div>';
return;
}

msg.innerHTML='<div class="msg">⏳ Login ho raha hai...</div>';

auth.signInWithEmailAndPassword(email,password)

.then(function(result){

if(result.user.email.toLowerCase()!=ADMIN.toLowerCase()){

auth.signOut();

msg.innerHTML=
'<div class="msg">❌ Sirf Admin account login kar sakta hai.</div>';

return;
}

msg.innerHTML=
'<div class="msg">✅ Login successful.</div>';

})

.catch(function(error){

console.log(error);

msg.innerHTML=
'<div class="msg">❌ Email ya Password galat hai.</div>';

});

};


/* ENTER TO LOGIN */

document.getElementById("password").onkeydown=function(e){

if(e.key==="Enter"){
document.getElementById("loginBtn").click();
}

};


/* LOGIN CHECK */

auth.onAuthStateChanged(function(user){

if(user && user.email.toLowerCase()==ADMIN.toLowerCase()){

document.getElementById("loginPage").classList.add("hidden");

document.getElementById("adminPage").classList.remove("hidden");

loadSettings();
loadProducts();
loadOrders();

}else{

document.getElementById("loginPage").classList.remove("hidden");

document.getElementById("adminPage").classList.add("hidden");

}

});


/* LOGOUT */

document.getElementById("logout").onclick=function(){

auth.signOut();

};


/* SETTINGS */

function loadSettings(){

db.collection("settings").doc("store").get()

.then(function(snap){

if(snap.exists){

let d=snap.data();

document.getElementById("storeName").value=d.storeName||"";
document.getElementById("upiId").value=d.upiId||"";
document.getElementById("logoUrl").value=d.logoUrl||"";
document.getElementById("logoPreview").src=d.logoUrl||"";

}

});

}


/* LOGO PREVIEW */

document.getElementById("logoUrl").oninput=function(){

document.getElementById("logoPreview").src=this.value;

};


/* SAVE SETTINGS */

document.getElementById("saveSettings").onclick=function(){

let storeName=document.getElementById("storeName").value.trim();
let upiId=document.getElementById("upiId").value.trim();
let logoUrl=document.getElementById("logoUrl").value.trim();

if(!storeName){
alert("Shop Name bharen.");
return;
}

db.collection("settings").doc("store").set({

storeName:storeName,
upiId:upiId,
logoUrl:logoUrl,
updatedAt:Date.now()

},{merge:true})

.then(function(){

document.getElementById("settingsMsg").innerHTML=
'<div class="msg">✅ Settings save ho gayi.</div>';

})

.catch(function(error){

console.log(error);

document.getElementById("settingsMsg").innerHTML=
'<div class="msg">❌ Settings save nahi hui.</div>';

});

};


/* ADD / UPDATE PRODUCT */

document.getElementById("saveProduct").onclick=function(){

let id=document.getElementById("productId").value;
let name=document.getElementById("productName").value.trim();
let price=document.getElementById("productPrice").value;
let category=document.getElementById("productCategory").value;
let image=document.getElementById("productImage").value.trim();

if(!name){
alert("Product Name bharen.");
return;
}

if(!price){
alert("Price bharen.");
return;
}

if(!image){
alert("Product Image URL bharen.");
return;
}

let data={
name:name,
price:Number(price),
category:category,
image:image,
updatedAt:Date.now()
};

let task;

if(id){

task=db.collection("products").doc(id).update(data);

}else{

data.createdAt=Date.now();

task=db.collection("products").add(data);

}

task.then(function(){

document.getElementById("productMsg").innerHTML=
'<div class="msg">✅ Product save ho gaya.</div>';

clearProduct();

loadProducts();

})

.catch(function(error){

console.log(error);
alert("Product save nahi hua.");

});

};


/* LOAD PRODUCTS */

function loadProducts(){

let box=document.getElementById("products");

box.innerHTML="Loading...";

db.collection("products").get()

.then(function(snapshot){

if(snapshot.empty){

box.innerHTML=
'<div class="msg">Abhi koi product nahi hai.</div>';

return;

}

box.innerHTML="";

snapshot.forEach(function(doc){

let p=doc.data();

let div=document.createElement("div");
div.className="product";

div.innerHTML=`
<img src="${p.image||""}">
<h3>${p.name||""}</h3>
<div class="price">₹${p.price||0}</div>
<p>Category: ${p.category||""}</p>
<button class="blue" onclick="editProduct('${doc.id}')">
✏️ EDIT
</button>
<button class="red" onclick="deleteProduct('${doc.id}')">
🗑️ DELETE
</button>
`;

box.appendChild(div);

});

})

.catch(function(error){

console.log(error);

box.innerHTML=
'<div class="msg">❌ Products load nahi ho rahe.</div>';

});

}


/* EDIT PRODUCT */

window.editProduct=function(id){

db.collection("products").doc(id).get()

.then(function(snap){

let p=snap.data();

document.getElementById("productId").value=id;
document.getElementById("productName").value=p.name||"";
document.getElementById("productPrice").value=p.price||"";
document.getElementById("productCategory").value=p.category||"Men";
document.getElementById("productImage").value=p.image||"";

document.getElementById("productHeading").innerText=
"✏️ Edit Product";

document.getElementById("saveProduct").innerText=
"UPDATE PRODUCT";

document.getElementById("cancelEdit").classList.remove("hidden");

window.scrollTo(0,0);

});

};


/* CANCEL EDIT */

document.getElementById("cancelEdit").onclick=function(){

clearProduct();

};


function clearProduct(){

document.getElementById("productId").value="";
document.getElementById("productName").value="";
document.getElementById("productPrice").value="";
document.getElementById("productCategory").value="Men";
document.getElementById("productImage").value="";

document.getElementById("productHeading").innerText=
"➕ Add New Product";

document.getElementById("saveProduct").innerText=
"ADD PRODUCT";

document.getElementById("cancelEdit").classList.add("hidden");

}


/* DELETE PRODUCT */

window.deleteProduct=function(id){

if(!confirm("Kya aap product delete karna chahte hain?")){
return;
}

db.collection("products").doc(id).delete()

.then(function(){

loadProducts();

});

};


/* LOAD ORDERS */

function loadOrders(){

let box=document.getElementById("orders");

box.innerHTML="Loading...";

db.collection("orders").get()

.then(function(snapshot){

if(snapshot.empty){

box.innerHTML=
'<div class="msg">Abhi koi order nahi hai.</div>';

return;

}

box.innerHTML="";

snapshot.forEach(function(doc){

let o=doc.data();

let div=document.createElement("div");
div.className="order";

div.innerHTML=`
<b>📦 Order ID:</b> ${doc.id}
<br><br>
<b>Name:</b> ${o.name||o.customerName||""}
<br>
<b>Mobile:</b> ${o.mobile||o.phone||""}
<br>
<b>Address:</b> ${o.address||""}
<br>
<b>PIN Code:</b> ${o.pincode||o.pinCode||""}
<br>
<b>Total:</b> ₹${o.total||""}
<br><br>

<select onchange="changeStatus('${doc.id}',this.value)">
<option ${o.status=="Pending"||!o.status?"selected":""}>Pending</option>
<option ${o.status=="Confirmed"?"selected":""}>Confirmed</option>
<option ${o.status=="Shipped"?"selected":""}>Shipped</option>
<option ${o.status=="Delivered"?"selected":""}>Delivered</option>
<option ${o.status=="Cancelled"?"selected":""}>Cancelled</option>
</select>

<button class="red" onclick="deleteOrder('${doc.id}')">
🗑️ DELETE ORDER
</button>
`;

box.appendChild(div);

});

});

}


/* REFRESH ORDERS */

document.getElementById("refreshOrders").onclick=function(){

loadOrders();

};


/* ORDER STATUS */

window.changeStatus=function(id,status){

db.collection("orders").doc(id).update({

status:status,
updatedAt:Date.now()

});

};


/* DELETE ORDER */

window.deleteOrder=function(id){

if(!confirm("Kya aap order delete karna chahte hain?")){
return;
}

db.collection("orders").doc(id).delete()

.then(function(){

loadOrders();

});

};

</script>

</body>
      </html>
