<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clothing Store India - Admin</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#111;
  color:white;
  padding:18px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:25px;
}

header p{
  margin:6px 0 0;
}

.container{
  max-width:650px;
  margin:20px auto;
  padding:15px;
}

.card{
  background:white;
  padding:20px;
  border-radius:14px;
  margin-bottom:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.10);
}

h2{
  margin-top:0;
}

input,
select{
  width:100%;
  padding:13px;
  margin:8px 0 14px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:8px;
  background:#111;
  color:white;
  font-size:16px;
  cursor:pointer;
  margin-top:5px;
}

.delete{
  background:#d32f2f;
}

.edit{
  background:#1976d2;
}

.save{
  background:#188038;
}

.logout{
  background:#555;
}

.hidden{
  display:none;
}

.message{
  padding:10px;
  border-radius:8px;
  margin-top:12px;
  background:#eee;
}

.product{
  border:1px solid #ddd;
  border-radius:12px;
  padding:12px;
  margin-top:15px;
}

.product img{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:10px;
}

.product h3{
  margin-bottom:5px;
}

.price{
  font-size:20px;
  font-weight:bold;
  margin:8px 0;
}

.order{
  border:1px solid #ddd;
  border-radius:12px;
  padding:15px;
  margin-top:15px;
  background:#fafafa;
}

.order p{
  margin:7px 0;
}

.status{
  font-weight:bold;
}

.logoPreview{
  width:120px;
  height:120px;
  object-fit:contain;
  border:1px solid #ddd;
  border-radius:10px;
  margin:10px 0;
}

.small{
  font-size:13px;
  color:#666;
}

</style>
</head>

<body>

<header>

<h1 id="headerStoreName">
Clothing Store India
</h1>

<p>Admin Panel</p>

</header>


<div class="container">


<!-- ADMIN LOGIN -->

<div id="loginBox" class="card">

<h2>Admin Login</h2>

<input
type="email"
id="email"
placeholder="Admin Email"
>

<input
type="password"
id="password"
placeholder="Password"
>

<button onclick="login()">
LOGIN
</button>

<div
id="loginMessage"
class="message">
</div>

</div>



<!-- ADMIN PANEL -->

<div id="adminPanel" class="hidden">


<!-- STORE SETTINGS -->

<div class="card">

<h2>Store Settings</h2>

<label>Shop Name</label>

<input
type="text"
id="storeName"
placeholder="Shop Name"
>

<label>UPI ID</label>

<input
type="text"
id="upiId"
placeholder="example@upi"
>

<label>Shop Logo Image URL</label>

<input
type="text"
id="logoUrl"
placeholder="Logo Image URL"
>

<img
id="logoPreview"
class="logoPreview hidden"
alt="Logo Preview"
>

<button
class="save"
onclick="saveSettings()"
>
SAVE STORE SETTINGS
</button>

<div
id="settingsMessage"
class="message">
</div>

</div>



<!-- ADD PRODUCT -->

<div class="card">

<h2>Add New Product</h2>

<input
type="text"
id="productName"
placeholder="Product Name"
>

<input
type="number"
id="productPrice"
placeholder="Price ₹"
>

<select id="productCategory">

<option value="Men">
Men
</option>

<option value="Women">
Women
</option>

</select>

<input
type="text"
id="productImage"
placeholder="Product Image URL"
>

<button onclick="addProduct()">
ADD PRODUCT
</button>

<div
id="addMessage"
class="message">
</div>

</div>



<!-- PRODUCTS -->

<div class="card">

<h2>Your Products</h2>

<div id="productsList">
Loading...
</div>

</div>



<!-- ORDERS -->

<div class="card">

<h2>Customer Orders</h2>

<div id="ordersList">
Loading...
</div>

</div>



<!-- LOGOUT -->

<div class="card">

<button
class="logout"
onclick="logout()">
LOGOUT
</button>

</div>

</div>

</div>



<script type="module">


/* =====================================
   FIREBASE IMPORT
===================================== */

import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";


import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
}

from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";


import {
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
updateDoc,
doc,
setDoc,
getDoc
}

from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";



/* =====================================
   FIREBASE CONFIG
===================================== */

const firebaseConfig = {

apiKey:
"AIzaSyDjG5fKH7apknSPMUCBs3pVa91Hj5vMnB4",

authDomain:
"clothing-store-india.firebaseapp.com",

projectId:
"clothing-store-india",

storageBucket:
"clothing-store-india.firebasestorage.app",

messagingSenderId:
"1032694314798",

appId:
"1:1032694314798:web:00484f9e6fc47394ddacbf"

};



/* =====================================
   START FIREBASE
===================================== */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);



/* =====================================
   ADMIN LOGIN
===================================== */

window.login = async function(){

const email =
document
.getElementById("email")
.value
.trim();

const password =
document
.getElementById("password")
.value;

const message =
document
.getElementById("loginMessage");


if(!email || !password){

message.innerText =
"Email aur password dono bharen.";

return;

}


try{

await signInWithEmailAndPassword(
auth,
email,
password
);

message.innerText =
"Login successful.";

}

catch(error){

message.innerText =
"Login failed: "
+ error.message;

}

};



/* =====================================
   LOGIN STATUS
===================================== */

onAuthStateChanged(
auth,
user => {

const loginBox =
document.getElementById(
"loginBox"
);

const adminPanel =
document.getElementById(
"adminPanel"
);


if(user){

loginBox.classList.add(
"hidden"
);

adminPanel.classList.remove(
"hidden"
);

loadSettings();
loadProducts();
loadOrders();

}

else{

loginBox.classList.remove(
"hidden"
);

adminPanel.classList.add(
"hidden"
);

}

});



/* =====================================
   STORE SETTINGS LOAD
===================================== */

async function loadSettings(){

try{

const settingsRef =
doc(
db,
"settings",
"store"
);

const settingsSnap =
await getDoc(settingsRef);


if(settingsSnap.exists()){

const data =
settingsSnap.data();


document
.getElementById("storeName")
.value =
data.storeName || "Clothing Store India";


document
.getElementById("upiId")
.value =
data.upiId || "";


document
.getElementById("logoUrl")
.value =
data.logoUrl || "";


document
.getElementById("headerStoreName")
.innerText =
data.storeName || "Clothing Store India";


if(data.logoUrl){

const preview =
document.getElementById(
"logoPreview"
);

preview.src =
data.logoUrl;

preview.classList.remove(
"hidden"
);

}

}

}

catch(error){

console.log(
"Settings load error:",
error
);

}

}



/* =====================================
   SAVE STORE SETTINGS
===================================== */

window.saveSettings =
async function(){

const storeName =
document
.getElementById("storeName")
.value
.trim();

const upiId =
document
.getElementById("upiId")
.value
.trim();

const logoUrl =
document
.getElementById("logoUrl")
.value
.trim();

const message =
document
.getElementById(
"settingsMessage"
);


if(!storeName){

message.innerText =
"Shop Name bharen.";

return;

}


try{

await setDoc(

doc(
db,
"settings",
"store"
),

{

storeName:storeName,

upiId:upiId,

logoUrl:logoUrl,

updatedAt:Date.now()

}

);


document
.getElementById(
"headerStoreName"
)
.innerText =
storeName;


const preview =
document.getElementById(
"logoPreview"
);


if(logoUrl){

preview.src =
logoUrl;

preview.classList.remove(
"hidden"
);

}


message.innerText =
"Store settings successfully save ho gayi.";

}

catch(error){

message.innerText =
"Settings save failed: "
+ error.message;

}

};



/* =====================================
   ADD PRODUCT
===================================== */

window.addProduct =
async function(){

const name =
document
.getElementById(
"productName"
)
.value
.trim();


const price =
document
.getElementById(
"productPrice"
)
.value;


const category =
document
.getElementById(
"productCategory"
)
.value;


const image =
document
.getElementById(
"productImage"
)
.value
.trim();


const message =
document
.getElementById(
"addMessage"
);


if(!name || !price || !image){

message.innerText =
"Product name, price aur image URL bharen.";

return;

}


try{

await addDoc(

collection(
db,
"products"
),

{

name:name,

price:Number(price),

category:category,

image:image,

createdAt:Date.now()

}

);


message.innerText =
"Product successfully add ho gaya.";


document
.getElementById(
"productName"
)
.value="";


document
.getElementById(
"productPrice"
)
.value="";


document
.getElementById(
"productImage"
)
.value="";


loadProducts();

}

catch(error){

message.innerText =
"Error: "
+ error.message;

}

};



/* =====================================
   LOAD PRODUCTS
===================================== */

async function loadProducts(){

const list =
document.getElementById(
"productsList"
);

list.innerHTML =
"Loading...";


try{

const snapshot =
await getDocs(
collection(
db,
"products"
)
);


list.innerHTML="";


if(snapshot.empty){

list.innerHTML =
"<p>Abhi koi product nahi hai.</p>";

return;

}


snapshot.forEach(
item => {

const data =
item.data();


const div =
document.createElement(
"div"
);

div.className =
"product";


div.innerHTML = `

<img
src="${data.image}"
alt="${data.name}"
>

<h3>
${data.name}
</h3>

<div class="price">
₹${data.price}
</div>

<p>
Category: ${data.category}
</p>

<button
class="edit"
onclick="editProduct('${item.id}')"
>
EDIT PRODUCT
</button>

<button
class="delete"
onclick="deleteProduct('${item.id}')"
>
DELETE PRODUCT
</button>

`;


list.appendChild(div);

});

}

catch(error){

list.innerHTML =
"Products load nahi ho rahe: "
+ error.message;

}

}



/* =====================================
   EDIT PRODUCT
===================================== */

window.editProduct =
async function(id){

const name =
prompt(
"Product ka naam:"
);

if(name === null){

return;

}


const price =
prompt(
"Product ki price:"
);

if(price === null){

return;

}


const image =
prompt(
"Product image URL:"
);

if(image === null){

return;

}


const category =
prompt(
"Category: Men ya Women",
"Men"
);

if(category === null){

return;

}


try{

await updateDoc(

doc(
db,
"products",
id
),

{

name:name.trim(),

price:Number(price),

image:image.trim(),

category:category.trim(),

updatedAt:Date.now()

}

);


alert(
"Product successfully update ho gaya."
);

loadProducts();

}

catch(error){

alert(
"Update failed: "
+ error.message
);

}

};



/* =====================================
   DELETE PRODUCT
===================================== */

window.deleteProduct =
async function(id){

const confirmDelete =
confirm(
"Kya aap is product ko delete karna chahte hain?"
);


if(!confirmDelete){

return;

}


try{

await deleteDoc(
doc(
db,
"products",
id
)
);


alert(
"Product delete ho gaya."
);


loadProducts();

}

catch(error){

alert(
"Delete failed: "
+ error.message
);

}

};



/* =====================================
   LOAD ORDERS
===================================== */

async function loadOrders(){

const list =
document.getElementById(
"ordersList"
);

list.innerHTML =
"Loading...";


try{

const snapshot =
await getDocs(
collection(
db,
"orders"
)
);


list.innerHTML="";


if(snapshot.empty){

list.innerHTML =
"<p>Abhi koi order nahi hai.</p>";

return;

}


snapshot.forEach(
item => {

const data =
item.data();


const div =
document.createElement(
"div"
);

div.className =
"order";


div.innerHTML = `

<h3>
Order
</h3>

<p>
<strong>Name:</strong>
${data.name || ""}
</p>

<p>
<strong>Mobile:</strong>
${data.mobile || ""}
</p>

<p>
<strong>Address:</strong>
${data.address || ""}
</p>

<p>
<strong>PIN Code:</strong>
${data.pincode || data.pinCode || ""}
</p>

<p>
<strong>Product:</strong>
${data.productName || ""}
</p>

<p>
<strong>Price:</strong>
₹${data.price || ""}
</p>

<p>
<strong>Status:</strong>
<span class="status">
${data.status || "New"}
</span>
</p>

<button
class="edit"
onclick="updateOrderStatus('${item.id}')"
>
UPDATE ORDER STATUS
</button>

<button
class="delete"
onclick="deleteOrder('${item.id}')"
>
DELETE ORDER
</button>

`;

list.appendChild(div);

});

}

catch(error){

list.innerHTML =
"Orders load nahi ho rahe: "
+ error.message;

}

}



/* =====================================
   UPDATE ORDER STATUS
===================================== */

window.updateOrderStatus =
async function(id){

const status =
prompt(
"Order Status likhen:",
"Processing"
);

if(status === null){

return;

}


try{

await updateDoc(

doc(
db,
"orders",
id
),

{

status:status.trim(),

updatedAt:Date.now()

}

);


alert(
"Order status update ho gaya."
);

loadOrders();

}

catch(error){

alert(
"Status update failed: "
+ error.message
);

}

};



/* =====================================
   DELETE ORDER
===================================== */

window.deleteOrder =
async function(id){

const confirmDelete =
confirm(
"Kya aap is order ko delete karna chahte hain?"
);


if(!confirmDelete){

return;

}


try{

await deleteDoc(

doc(
db,
"orders",
id
)

);


alert(
"Order delete ho gaya."
);

loadOrders();

}

catch(error){

alert(
"Order delete failed: "
+ error.message
);

}

};



/* =====================================
   LOGOUT
===================================== */

window.logout =
async function(){

await signOut(auth);

};

</script>

</body>
  </html>
