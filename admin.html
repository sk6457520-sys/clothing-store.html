<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clothing Store India - Admin Panel</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f3f6;
  color:#222;
}

header{
  background:#111;
  color:white;
  text-align:center;
  padding:18px;
}

header h1{
  margin:0;
  font-size:24px;
}

header p{
  margin:6px 0 0;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  padding:18px;
  margin-bottom:18px;
  border-radius:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.login-card{
  max-width:500px;
  margin:70px auto;
}

h2{
  margin-top:0;
}

input,select{
  width:100%;
  padding:14px;
  margin:7px 0 14px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:16px;
}

button{
  border:0;
  padding:13px 18px;
  border-radius:9px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  margin:4px;
}

.login-btn{
  width:100%;
  background:#111;
  color:white;
  font-size:17px;
}

.green{
  background:#16803c;
  color:white;
}

.blue{
  background:#1266d6;
  color:white;
}

.red{
  background:#d71920;
  color:white;
}

.gray{
  background:#777;
  color:white;
}

.hidden{
  display:none !important;
}

.message{
  padding:12px;
  margin-top:10px;
  border-radius:8px;
  background:#f0f0f0;
}

.logo-preview{
  width:130px;
  height:130px;
  object-fit:contain;
  border:1px solid #ddd;
  border-radius:10px;
  margin:10px 0;
  background:#f5f5f5;
}

.product{
  border:1px solid #ddd;
  padding:12px;
  border-radius:10px;
  margin-bottom:12px;
}

.product img{
  width:180px;
  height:180px;
  object-fit:contain;
  display:block;
  margin:auto;
  background:#f5f5f5;
  border-radius:8px;
}

.price{
  font-size:19px;
  font-weight:bold;
  margin:6px 0;
}

.order{
  border:1px solid #ddd;
  padding:14px;
  border-radius:10px;
  margin-bottom:12px;
  word-break:break-word;
}

.order-id{
  font-weight:bold;
  font-size:17px;
  margin-bottom:8px;
}

.small{
  color:#666;
  font-size:13px;
}
</style>
</head>

<body>

<!-- LOGIN PAGE -->
<div id="loginPage">

  <div class="card login-card">

    <h2>🔐 Admin Login</h2>

    <input
      id="email"
      type="email"
      placeholder="Admin Email"
      autocomplete="email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button
      id="loginButton"
      class="login-btn"
      type="button"
    >
      LOGIN
    </button>

    <div id="loginMessage"></div>

  </div>

</div>


<!-- ADMIN PAGE -->
<div id="adminPage" class="hidden">

<header>
  <h1>Clothing Store India</h1>
  <p>Admin Panel</p>
</header>

<div class="container">

<!-- STORE SETTINGS -->
<div class="card">

<h2>🏪 Store Settings</h2>

<label>Shop Name</label>

<input
  id="storeName"
  type="text"
  placeholder="Shop Name"
>

<label>UPI ID</label>

<input
  id="upiId"
  type="text"
  placeholder="UPI ID"
>

<label>Logo Image URL</label>

<input
  id="logoUrl"
  type="url"
  placeholder="Logo Image URL"
>

<img
  id="logoPreview"
  class="logo-preview"
  src=""
  alt="Logo"
>

<br>

<button
  id="saveSettingsButton"
  class="green"
  type="button"
>
SAVE STORE SETTINGS
</button>

<div id="settingsMessage"></div>

</div>


<!-- ADD PRODUCT -->
<div class="card">

<h2 id="productTitle">
➕ Add New Product
</h2>

<input
  id="productId"
  type="hidden"
>

<label>Product Name</label>

<input
  id="productName"
  type="text"
  placeholder="Product Name"
>

<label>Price</label>

<input
  id="productPrice"
  type="number"
  placeholder="Product Price"
>

<label>Category</label>

<select id="productCategory">
  <option value="Men">Men</option>
  <option value="Women">Women</option>
</select>

<label>Product Image URL</label>

<input
  id="productImage"
  type="url"
  placeholder="Product Image URL"
>

<button
  id="saveProductButton"
  class="green"
  type="button"
>
ADD PRODUCT
</button>

<button
  id="cancelEditButton"
  class="gray hidden"
  type="button"
>
CANCEL
</button>

<div id="productMessage"></div>

</div>


<!-- PRODUCTS -->
<div class="card">

<h2>👕 Your Products</h2>

<div id="productsList">
Loading...
</div>

</div>


<!-- ORDERS -->
<div class="card">

<h2>📦 Customer Orders</h2>

<button
  id="refreshOrdersButton"
  class="blue"
  type="button"
>
🔄 REFRESH ORDERS
</button>

<div id="ordersList">
Loading...
</div>

</div>


<!-- LOGOUT -->
<div class="card">

<button
  id="logoutButton"
  class="red"
  type="button"
  style="width:100%;"
>
🚪 LOGOUT
</button>

</div>

</div>
</div>


<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore-compat.js"></script>


<script>

const firebaseConfig = {

  apiKey:
  "AIzaSyDjG5fKH7apknSPMUCB3s5pVa91Hj5vMnB4",

  authDomain:
  "clothing-store-india.firebaseapp.com",

  projectId:
  "clothing-store-india",

  storageBucket:
  "clothing-store-india.firebasestorage.app",

  messagingSenderId:
  "1032694314798",

  appId:
  "1:1032694314798:web:00484f9e6fc47394ddacbf"

};


firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const db = firebase.firestore();


const ADMIN_EMAIL = "sk6457520@gmail.com";


const loginPage =
document.getElementById("loginPage");

const adminPage =
document.getElementById("adminPage");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginButton =
document.getElementById("loginButton");

const loginMessage =
document.getElementById("loginMessage");


/* LOGIN */

loginButton.addEventListener("click", function(){

  const email =
  emailInput.value.trim();

  const password =
  passwordInput.value;


  if(email === ""){

    loginMessage.innerHTML =
    '<div class="message">Email bharen.</div>';

    return;
  }


  if(password === ""){

    loginMessage.innerHTML =
    '<div class="message">Password bharen.</div>';

    return;
  }


  loginMessage.innerHTML =
  '<div class="message">⏳ Login ho raha hai...</div>';


  auth.signInWithEmailAndPassword(
    email,
    password
  )

  .then(function(result){

    if(
      result.user.email.toLowerCase()
      !== ADMIN_EMAIL.toLowerCase()
    ){

      return auth.signOut()
      .then(function(){

        loginMessage.innerHTML =
        '<div class="message">❌ Sirf Admin account se login kar sakte hain.</div>';

      });

    }

    loginMessage.innerHTML =
    '<div class="message">✅ Login successful.</div>';

  })

  .catch(function(error){

    console.log(error);

    let message =
    "❌ Login failed.";

    if(error.code === "auth/invalid-credential"){
      message =
      "❌ Email ya Password galat hai.";
    }

    else if(error.code === "auth/user-not-found"){
      message =
      "❌ Ye Email Firebase me nahi mila.";
    }

    else if(error.code === "auth/wrong-password"){
      message =
      "❌ Password galat hai.";
    }

    else if(error.code === "auth/invalid-email"){
      message =
      "❌ Email format galat hai.";
    }

    else if(error.code === "auth/network-request-failed"){
      message =
      "❌ Internet connection check karein.";
    }

    else if(error.code === "auth/too-many-requests"){
      message =
      "❌ Bahut baar login try hua hai. Thodi der baad try karein.";
    }

    loginMessage.innerHTML =
    '<div class="message">' +
    message +
    '</div>';

  });

});


/* ENTER KEY */

passwordInput.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      loginButton.click();

    }

  }
);


/* AUTH CHECK */

auth.onAuthStateChanged(
  function(user){

    if(
      user &&
      user.email.toLowerCase()
      === ADMIN_EMAIL.toLowerCase()
    ){

      loginPage.classList.add("hidden");

      adminPage.classList.remove("hidden");

      loadSettings();

      loadProducts();

      loadOrders();

    }

    else{

      loginPage.classList.remove("hidden");

      adminPage.classList.add("hidden");

    }

  }
);


/* LOGOUT */

document
.getElementById("logoutButton")
.addEventListener(
  "click",
  function(){

    auth.signOut();

  }
);


/* LOAD SETTINGS */

function loadSettings(){

  db.collection("settings")
  .doc("store")
  .get()

  .then(function(snapshot){

    if(snapshot.exists){

      const data =
      snapshot.data();

      document.getElementById("storeName").value =
      data.storeName || "";

      document.getElementById("upiId").value =
      data.upiId || "";

      document.getElementById("logoUrl").value =
      data.logoUrl || "";

      document.getElementById("logoPreview").src =
      data.logoUrl || "";

    }

  })

  .catch(function(error){

    console.log(error);

  });

}


/* LOGO PREVIEW */

document
.getElementById("logoUrl")
.addEventListener(
  "input",
  function(){

    document.getElementById("logoPreview").src =
    this.value.trim();

  }
);


/* SAVE SETTINGS */

document
.getElementById("saveSettingsButton")
.addEventListener(
  "click",
  function(){

    const storeName =
    document.getElementById("storeName")
    .value.trim();

    const upiId =
    document.getElementById("upiId")
    .value.trim();

    const logoUrl =
    document.getElementById("logoUrl")
    .value.trim();


    if(storeName === ""){

      alert("Shop Name bharen.");

      return;

    }


    db.collection("settings")
    .doc("store")
    .set({

      storeName:storeName,

      upiId:upiId,

      logoUrl:logoUrl,

      updatedAt:Date.now()

    },{
      merge:true
    })

    .then(function(){

      document.getElementById(
        "settingsMessage"
      ).innerHTML =
      '<div class="message">✅ Settings save ho gayi.</div>';

    })

    .catch(function(error){

      console.log(error);

      document.getElementById(
        "settingsMessage"
      ).innerHTML =
      '<div class="message">❌ Settings save nahi hui.</div>';

    });

  }
);


/* SAVE PRODUCT */

document
.getElementById("saveProductButton")
.addEventListener(
  "click",
  function(){

    const productId =
    document.getElementById("productId")
    .value.trim();

    const name =
    document.getElementById("productName")
    .value.trim();

    const price =
    document.getElementById("productPrice")
    .value.trim();

    const category =
    document.getElementById("productCategory")
    .value;

    const image =
    document.getElementById("productImage")
    .value.trim();


    if(name === ""){

      alert("Product Name bharen.");

      return;

    }


    if(price === ""){

      alert("Product Price bharen.");

      return;

    }


    if(image === ""){

      alert("Product Image URL bharen.");

      return;

    }


    const productData = {

      name:name,

      price:Number(price),

      category:category,

      image:image,

      updatedAt:Date.now()

    };


    let request;


    if(productId){

      request =
      db.collection("products")
      .doc(productId)
      .update(productData);

    }

    else{

      productData.createdAt =
      Date.now();

      request =
      db.collection("products")
      .add(productData);

    }


    request

    .then(function(){

      document.getElementById(
        "productMessage"
      ).innerHTML =
      '<div class="message">✅ Product save ho gaya.</div>';

      clearProductForm();

      loadProducts();

    })

    .catch(function(error){

      console.log(error);

      alert(
        "❌ Product save nahi hua."
      );

    });

  }
);


/* LOAD PRODUCTS */

function loadProducts(){

  const list =
  document.getElementById(
    "productsList"
  );

  list.innerHTML =
  "Loading products...";


  db.collection("products")
  .get()

  .then(function(snapshot){

    if(snapshot.empty){

      list.innerHTML =
      '<div class="message">Abhi koi product nahi hai.</div>';

      return;

    }


    const products = [];


    snapshot.forEach(
      function(doc){

        products.push({

          id:doc.id,

          ...doc.data()

        });

      }
    );


    products.sort(
      function(a,b){

        return (b.createdAt || 0)
        -
        (a.createdAt || 0);

      }
    );


    list.innerHTML = "";


    products.forEach(
      function(product){

        const div =
        document.createElement("div");

        div.className =
        "product";


        const img =
        document.createElement("img");

        img.src =
        product.image || "";


        const name =
        document.createElement("h3");

        name.textContent =
        product.name || "";


        const price =
        document.createElement("div");

        price.className =
        "price";

        price.textContent =
        "₹" + (product.price || 0);


        const category =
        document.createElement("div");

        category.textContent =
        "Category: " +
        (product.category || "");


        const edit =
        document.createElement("button");

        edit.className =
        "blue";

        edit.textContent =
        "✏️ EDIT";


        edit.onclick =
        function(){

          editProduct(product);

        };


        const del =
        document.createElement("button");

        del.className =
        "red";

        del.textContent =
        "🗑️ DELETE";


        del.onclick =
        function(){

          deleteProduct(product.id);

        };


        div.appendChild(img);

        div.appendChild(name);

        div.appendChild(price);

        div.appendChild(category);

        div.appendChild(edit);

        div.appendChild(del);


        list.appendChild(div);

      }
    );

  })

  .catch(function(error){

    console.log(error);

    list.innerHTML =
    '<div class="message">❌ Products load nahi ho rahe.</div>';

  });

}


/* EDIT PRODUCT */

function editProduct(product){

  document.getElementById("productId").value =
  product.id || "";

  document.getElementById("productName").value =
  product.name || "";

  document.getElementById("productPrice").value =
  product.price || "";

  document.getElementById("productCategory").value =
  product.category || "Men";

  document.getElementById("productImage").value =
  product.image || "";


  document.getElementById("productTitle")
  .textContent =
  "✏️ Edit Product";


  document.getElementById("saveProductButton")
  .textContent =
  "UPDATE PRODUCT";


  document.getElementById("cancelEditButton")
  .classList.remove("hidden");


  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

}


/* CLEAR PRODUCT */

function clearProductForm(){

  document.getElementById("productId").value =
  "";

  document.getElementById("productName").value =
  "";

  document.getElementById("productPrice").value =
  "";

  document.getElementById("productCategory").value =
  "Men";

  document.getElementById("productImage").value =
  "";


  document.getElementById("productTitle")
  .textContent =
  "➕ Add New Product";


  document.getElementById("saveProductButton")
  .textContent =
  "ADD PRODUCT";


  document.getElementById("cancelEditButton")
  .classList.add("hidden");

}


document
.getElementById("cancelEditButton")
.addEventListener(
  "click",
  clearProductForm
);


/* DELETE PRODUCT */

function deleteProduct(id){

  if(
    !confirm(
      "Kya aap is product ko delete karna chahte hain?"
    )
  ){

    return;

  }


  db.collection("products")
  .doc(id)
  .delete()

  .then(function(){

    loadProducts();

  })

  .catch(function(error){

    console.log(error);

    alert(
      "❌ Product delete nahi hua."
    );

  });

}


/* LOAD ORDERS */

function loadOrders(){

  const list =
  document.getElementById(
    "ordersList"
  );

  list.innerHTML =
  "Loading orders...";


  db.collection("orders")
  .get()

  .then(function(snapshot){

    if(snapshot.empty){

      list.innerHTML =
      '<div class="message">Abhi koi order nahi hai.</div>';

      return;

    }


    const orders = [];


    snapshot.forEach(
      function(doc){

        orders.push({

          id:doc.id,

          ...doc.data()

        });

      }
    );


    orders.sort(
      function(a,b){

        return (b.createdAt || 0)
        -
        (a.createdAt || 0);

      }
    );


    list.innerHTML = "";


    orders.forEach(
      function(order){

        const div =
        document.createElement("div");

        div.className =
        "order";


        const title =
        document.createElement("div");

        title.className =
        "order-id";

        title.textContent =
        "📦 Order ID: " +
        order.id;


        const info =
        document.createElement("div");


        let text = "";


        if(order.name || order.customerName){

          text +=
          "Name: " +
          (order.name || order.customerName) +
          "\n";

        }


        if(order.mobile || order.phone){

          text +=
          "Mobile: " +
          (order.mobile || order.phone) +
          "\n";

        }


        if(order.address){

          text +=
          "Address: " +
          order.address +
          "\n";

        }


        if(order.pincode || order.pinCode){

          text +=
          "PIN Code: " +
          (order.pincode || order.pinCode) +
          "\n";

        }


        if(order.total){

          text +=
          "Total: ₹" +
          order.total +
          "\n";

        }


        if(order.createdAt){

          text +=
          "Time: " +
          new Date(
            order.createdAt
          ).toLocaleString("en-IN");

        }


        info.style.whiteSpace =
        "pre-line";

        info.textContent =
        text;


        const status =
        document.createElement("select");


        const statusList = [

          "Pending",

          "Confirmed",

          "Shipped",

          "Delivered",

          "Cancelled"

        ];


        statusList.forEach(
          function(value){

            const option =
            document.createElement(
              "option"
            );

            option.value =
            value;

            option.textContent =
            value;

            status.appendChild(
              option
            );

          }
        );


        status.value =
        order.status ||
        "Pending";


        status.onchange =
        function(){

          updateOrderStatus(
            order.id,
            status.value
          );

        };


        const del =
        document.createElement("button");

        del.className =
        "red";

        del.textContent =
        "🗑️ DELETE ORDER";


        del.onclick =
        function(){

          deleteOrder(
            order.id
          );

        };


        div.appendChild(title);

        div.appendChild(info);

        div.appendChild(
          document.createElement("br")
        );

        div.appendChild(status);

        div.appendChild(del);


        list.appendChild(div);

      }
    );

  })

  .catch(function(error){

    console.log(error);

    list.innerHTML =
    '<div class="message">❌ Orders load nahi ho rahe.</div>';

  });

}


/* REFRESH ORDERS */

document
.getElementById("refreshOrdersButton")
.addEventListener(
  "click",
  loadOrders
);


/* UPDATE ORDER STATUS */

function updateOrderStatus(
  id,
  status
){

  db.collection("orders")
  .doc(id)
  .update({

    status:status,

    updatedAt:Date.now()

  })

  .catch(function(error){

    console.log(error);

    alert(
      "❌ Order status update nahi hua."
    );

  });

}


/* DELETE ORDER */

function deleteOrder(id){

  if(
    !confirm(
      "Kya aap is order ko delete karna chahte hain?"
    )
  ){

    return;

  }


  db.collection("orders")
  .doc(id)
  .de
