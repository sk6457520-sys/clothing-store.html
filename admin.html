/* ================= FIREBASE CONFIG ================= */

const firebaseConfig = {

  authDomain:
  "clothing-store-india.firebaseapp.com",

  projectId:
  "clothing-store-india",

  storageBucket:
  "clothing-store-india.firebasestorage.app",

  messagingSenderId:
  "1032694314798",

  appId:
  "1:1032694314798:web:00484f9e6fc47394ddacbf"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


const ADMIN_EMAIL =
"sk6457520@gmail.com";


/* ================= ELEMENTS ================= */

const loginPage =
document.getElementById("loginPage");

const adminPage =
document.getElementById("adminPage");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginButton =
document.getElementById("loginButton");

const loginMessage =
document.getElementById("loginMessage");


/* ================= LOGIN ================= */

loginButton.addEventListener("click", async function(){

  const email =
  emailInput.value.trim();

  const password =
  passwordInput.value;


  loginMessage.innerHTML =
  '<div class="message">Login ho raha hai...</div>';


  if(!email){

    loginMessage.innerHTML =
    '<div class="message">Email bharen.</div>';

    return;
  }


  if(!password){

    loginMessage.innerHTML =
    '<div class="message">Password bharen.</div>';

    return;
  }


  try{

    const result =
    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );


    if(result.user.email !== ADMIN_EMAIL){

      await signOut(auth);

      loginMessage.innerHTML =
      '<div class="message">Sirf Admin account se login kar sakte hain.</div>';

      return;
    }


    loginMessage.innerHTML =
    '<div class="message">✅ Login successful...</div>';


  }catch(error){

    console.error(error);

    loginMessage.innerHTML =
    '<div class="message">❌ Login failed. Email/password check karein.</div>';

  }

});


/* ================= ENTER KEY LOGIN ================= */

passwordInput.addEventListener("keydown", function(event){

  if(event.key === "Enter"){

    loginButton.click();

  }

});


/* ================= AUTH STATE ================= */

onAuthStateChanged(auth, async function(user){

  if(user && user.email === ADMIN_EMAIL){

    loginPage.classList.add("hidden");

    adminPage.classList.remove("hidden");


    await loadSettings();

    await loadProducts();

    await loadOrders();

  }

  else{

    loginPage.classList.remove("hidden");

    adminPage.classList.add("hidden");

  }

});


/* ================= LOGOUT ================= */

document
.getElementById("logoutButton")
.addEventListener("click", async function(){

  await signOut(auth);

});


/* ================= SETTINGS LOAD ================= */

async function loadSettings(){

  try{

    const ref =
    doc(db,"settings","store");

    const snap =
    await getDoc(ref);


    if(snap.exists()){

      const data =
      snap.data();


      document
      .getElementById("storeName")
      .value =
      data.storeName || "";


      document
      .getElementById("upiId")
      .value =
      data.upiId || "";


      document
      .getElementById("logoUrl")
      .value =
      data.logoUrl || "";


      document
      .getElementById("logoPreview")
      .src =
      data.logoUrl || "";

    }

  }catch(error){

    console.error(error);

  }

}


/* ================= LOGO PREVIEW ================= */

document
.getElementById("logoUrl")
.addEventListener("input", function(){

  document
  .getElementById("logoPreview")
  .src =
  this.value.trim();

});


/* ================= SAVE SETTINGS ================= */

document
.getElementById("saveSettingsButton")
.addEventListener("click", async function(){

  const storeName =
  document
  .getElementById("storeName")
  .value
  .trim();

  const upiId =
  document
  .getElementById("upiId")
  .value
  .trim();

  const logoUrl =
  document
  .getElementById("logoUrl")
  .value
  .trim();


  if(!storeName){

    alert("Shop Name bharen.");

    return;
  }


  try{

    await setDoc(

      doc(db,"settings","store"),

      {

        storeName:storeName,

        upiId:upiId,

        logoUrl:logoUrl,

        updatedAt:Date.now()

      },

      {merge:true}

    );


    document
    .getElementById("settingsMessage")
    .innerHTML =
    '<div class="message">✅ Settings save ho gayi.</div>';


  }catch(error){

    console.error(error);

    document
    .getElementById("settingsMessage")
    .innerHTML =
    '<div class="message">❌ Settings save nahi hui.</div>';

  }

});


/* ================= SAVE PRODUCT ================= */

document
.getElementById("saveProductButton")
.addEventListener("click", async function(){

  const productId =
  document
  .getElementById("productId")
  .value
  .trim();

  const name =
  document
  .getElementById("productName")
  .value
  .trim();

  const price =
  document
  .getElementById("productPrice")
  .value
  .trim();

  const category =
  document
  .getElementById("productCategory")
  .value;

  const image =
  document
  .getElementById("productImage")
  .value
  .trim();


  if(!name){

    alert("Product Name bharen.");

    return;
  }


  if(!price){

    alert("Product Price bharen.");

    return;
  }


  if(!image){

    alert("Product Image URL bharen.");

    return;
  }


  try{

    if(productId){

      await updateDoc(

        doc(db,"products",productId),

        {

          name:name,

          price:Number(price),

          category:category,

          image:image,

          updatedAt:Date.now()

        }

      );


      document
      .getElementById("productMessage")
      .innerHTML =
      '<div class="message">✅ Product update ho gaya.</div>';

    }

    else{

      await addDoc(

        collection(db,"products"),

        {

          name:name,

          price:Number(price),

          category:category,

          image:image,

          createdAt:Date.now(),

          updatedAt:Date.now()

        }

      );


      document
      .getElementById("productMessage")
      .innerHTML =
      '<div class="message">✅ Product add ho gaya.</div>';

    }


    clearProductForm();

    await loadProducts();


  }catch(error){

    console.error(error);

    alert("Product save nahi hua.");

  }

});


/* ================= LOAD PRODUCTS ================= */

async function loadProducts(){

  const list =
  document.getElementById("productsList");

  list.innerHTML =
  "Loading products...";


  try{

    const snapshot =
    await getDocs(
      collection(db,"products")
    );


    if(snapshot.empty){

      list.innerHTML =
      '<div class="message">Abhi koi product nahi hai.</div>';

      return;
    }


    const products=[];


    snapshot.forEach(function(item){

      products.push({

        id:item.id,

        ...item.data()

      });

    });


    products.sort(function(a,b){

      return (b.createdAt || 0) -
             (a.createdAt || 0);

    });


    list.innerHTML="";


    products.forEach(function(product){

      const div =
      document.createElement("div");

      div.className="product";


      const img =
      document.createElement("img");

      img.src =
      product.image || "";


      const name =
      document.createElement("h3");

      name.textContent =
      product.name || "";


      const price =
      document.createElement("div");

      price.className="price";

      price.textContent =
      "₹" + (product.price || 0);


      const category =
      document.createElement("div");

      category.textContent =
      "Category: " +
      (product.category || "");


      const edit =
      document.createElement("button");

      edit.className="blue";

      edit.textContent="✏️ EDIT";


      edit.addEventListener(
      "click",
      function(){

        editProduct(product);

      });


      const del =
      document.createElement("button");

      del.className="red";

      del.textContent="🗑️ DELETE";


      del.addEventListener(
      "click",
      function(){

        deleteProduct(product.id);

      });


      div.appendChild(img);

      div.appendChild(name);

      div.appendChild(price);

      div.appendChild(category);

      div.appendChild(edit);

      div.appendChild(del);

      list.appendChild(div);

    });


  }catch(error){

    console.error(error);

    list.innerHTML =
    '<div class="message">Products load nahi ho rahe.</div>';

  }

}


/* ================= EDIT PRODUCT ================= */

function editProduct(product){

  document
  .getElementById("productId")
  .value =
  product.id;


  document
  .getElementById("productName")
  .value =
  product.name || "";


  document
  .getElementById("productPrice")
  .value =
  product.price || "";


  document
  .getElementById("productCategory")
  .value =
  product.category || "Men";


  document
  .getElementById("productImage")
  .value =
  product.image || "";


  document
  .getElementById("productTitle")
  .textContent =
  "✏️ Edit Product";


  document
  .getElementById("saveProductButton")
  .textContent =
  "UPDATE PRODUCT";


  document
  .getElementById("cancelEditButton")
  .classList
  .remove("hidden");


  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

}
