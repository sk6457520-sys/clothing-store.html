<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clothing Store India</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f5f5;
  color:#222;
}

header{
  background:#111;
  color:white;
  padding:16px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:10;
}

header h1{
  font-size:24px;
}

.search{
  margin-top:12px;
  display:flex;
  gap:8px;
}

.search input{
  flex:1;
  padding:11px;
  border:0;
  border-radius:6px;
  font-size:15px;
}

.search button{
  border:0;
  padding:0 15px;
  border-radius:6px;
  background:#fff;
  cursor:pointer;
}

.categories{
  display:flex;
  gap:10px;
  padding:15px;
  overflow-x:auto;
  background:white;
}

.categories button{
  min-width:100px;
  padding:10px;
  border:1px solid #ddd;
  background:white;
  border-radius:20px;
  cursor:pointer;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:12px;
}

.product{
  background:white;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 2px 8px #ddd;
}

.product img{
  width:100%;
  height:210px;
  object-fit:cover;
}

.product-info{
  padding:10px;
}

.product h3{
  font-size:16px;
  margin-bottom:6px;
}

.price{
  font-weight:bold;
  font-size:18px;
  margin-bottom:9px;
}

.product button{
  width:100%;
  padding:10px;
  border:0;
  border-radius:6px;
  background:#111;
  color:white;
  cursor:pointer;
}

.cart{
  position:fixed;
  right:15px;
  bottom:15px;
  width:55px;
  height:55px;
  border-radius:50%;
  border:0;
  background:#111;
  color:white;
  font-size:22px;
  box-shadow:0 3px 10px #888;
}

.cart span{
  font-size:12px;
}

#orderBox{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  z-index:20;
  padding:20px;
}

.order{
  background:white;
  max-width:450px;
  margin:40px auto;
  padding:20px;
  border-radius:12px;
}

.order h2{
  margin-bottom:15px;
}

.order input,
.order textarea{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border:1px solid #ccc;
  border-radius:6px;
}

.order button{
  width:100%;
  padding:12px;
  border:0;
  border-radius:6px;
  background:#111;
  color:white;
  margin-top:5px;
}

.close{
  background:#ddd !important;
  color:#111 !important;
}

@media(min-width:700px){
  .products{
    grid-template-columns:repeat(4,1fr);
  }
}
</style>
</head>

<body>

<header>
  <h1>Clothing Store India</h1>

  <div class="search">
    <input id="searchInput" type="text" placeholder="Search clothes...">
    <button onclick="searchProducts()">Search</button>
  </div>
</header>

<div class="categories">
  <button onclick="showCategory('All')">All</button>
  <button onclick="showCategory('Men')">Men</button>
  <button onclick="showCategory('Women')">Women</button>
</div>

<div class="products" id="products"></div>

<button class="cart" onclick="openCart()">
  🛒 <span id="cartCount">0</span>
</button>

<div id="orderBox">
  <div class="order">
    <h2>Place Your Order</h2>

    <input id="customerName" placeholder="Your Name">
    <input id="mobile" placeholder="Mobile Number">
    <textarea id="address" rows="4"
      placeholder="Full Delivery Address"></textarea>

    <button onclick="placeOrder()">Place Order</button>
    <button class="close" onclick="closeOrder()">Close</button>
  </div>
</div>

<script>

const products = [

  {
    name:"Men Casual Shirt",
    price:699,
    category:"Men",
    image:"https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf"
  },

  {
    name:"Men T-Shirt",
    price:499,
    category:"Men",
    image:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab"
  },

  {
    name:"Women Kurti",
    price:799,
    category:"Women",
    image:"https://images.unsplash.com/photo-1583391733956-6c78276477e2"
  },

  {
    name:"Women Dress",
    price:999,
    category:"Women",
    image:"https://images.unsplash.com/photo-1595777457583-95e059d581b8"
  }

];

let cart = [];

function displayProducts(list){

  const box = document.getElementById("products");

  box.innerHTML="";

  list.forEach((product,index)=>{

    box.innerHTML += `
      <div class="product">

        <img src="${product.image}" alt="${product.name}">

        <div class="product-info">

          <h3>${product.name}</h3>

          <div class="price">
            ₹${product.price}
          </div>

          <button onclick="buyNow(${index})">
            Buy Now
          </button>

        </div>

      </div>
    `;

  });

}

function buyNow(index){

  cart.push(products[index]);

  document.getElementById("cartCount").innerText =
    cart.length;

  openOrder();

}

function openCart(){

  if(cart.length === 0){

    alert("Your cart is empty.");

    return;

  }

  openOrder();

}

function openOrder(){

  document.getElementById("orderBox").style.display="block";

}

function closeOrder(){

  document.getElementById("orderBox").style.display="none";

}

function placeOrder(){

  const name =
    document.getElementById("customerName").value;

  const mobile =
    document.getElementById("mobile").value;

  const address =
    document.getElementById("address").value;

  if(!name || !mobile || !address){

    alert("Please fill all details.");

    return;

  }

  alert(
    "Thank you " + name +
    "! Your order request has been received."
  );

  cart=[];

  document.getElementById("cartCount").innerText="0";

  closeOrder();

}

function showCategory(category){

  if(category==="All"){

    displayProducts(products);

  }else{

    displayProducts(
      products.filter(p => p.category===category)
    );

  }

}

function searchProducts(){

  const text =
    document.getElementById("searchInput")
    .value.toLowerCase();

  const result =
    products.filter(p =>
      p.name.toLowerCase().includes(text)
    );

  displayProducts(result);

}

displayProducts(products);

</script>

</body>
  </html>
